volumes:
  postgres-data:
  redis-data:

networks:
  backend:

x-common-env: &common-env
  HOST: "0.0.0.0"
  PORT: 3000 # change port
  REDIS_URL: redis://redis:6379
  DB_TYPE: postgres
  DB_NAME: mairie_360_database
  DB_USER: postgres
  DB_HOST: postgres
  DB_PASSWORD: password
  DB_PORT: 5432

services:
  postgres:
    image: ghcr.io/mairie360/database:1.1.0
    restart: always
    container_name: mairie360-db-template-api # change api name
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-password}
      POSTGRES_DB: mairie_360_database
    expose:
      - "5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  liquibase:
    image: ghcr.io/mairie360/liquibase-migrations:1.1.0
    container_name: mairie360-liquibase-template-api # change api name
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      <<: *common-env
      LIQUIBASE_COMMAND_URL: jdbc:postgresql://postgres:5432/mairie_360_database
      LIQUIBASE_COMMAND_USERNAME: ${DB_USER:-postgres}
      LIQUIBASE_COMMAND_PASSWORD: ${DB_PASSWORD:-password}
      LIQUIBASE_SEARCH_PATH: /migrations
    command: >
      --changelog-file=changelog.xml
      update
    networks:
      - backend

  seeder:
    image: postgres:18-alpine
    depends_on:
      liquibase:
        condition: service_completed_successfully
    volumes:
      - ./init-test.sql:/init-test.sql
    # On se connecte directement au service 'postgres' via son nom de service
    command: >
      sh -c "psql -h postgres -U postgres -d mairie_360_database -f /init-test.sql"
    environment:
      PGPASSWORD: ${DB_PASSWORD:-password}
    networks:
      - backend

  redis:
    image: redis:8.4.0-bookworm
    container_name: mairie360-redis-template-api # change api name
    restart: always
    expose:
      - "6379"
    volumes:
      - redis-data:/data
    networks:
      - backend
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  template: # change api name
    container_name: template_api-developpement # change api name
    # The API under test: the published ghcr.io/mairie360/template-api:dev-<sha> image in CI, or # change api name
    # template-api:local built by the *_test.sh script from development.Dockerfile. No build: block,
    # so CI tests the artifact that gets promoted instead of recompiling the sources.
    image: ${IMAGE_REF:?IMAGE_REF must name the API image under test, run the matching *_test.sh script}
    ports:
      - "3000:3000" # change port
    networks:
      - backend
    dns:
      - 8.8.8.8
      - 1.1.1.1
    environment:
      <<: *common-env
      PUBLIC_URL: http://template.development.mairie360.fr # change api name
      JWT_SECRET: b"secret"
      JWT_TIMEOUT: 3600
    depends_on:
      liquibase:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  # The published image is distroless (no shell, no curl), so the API cannot carry its own
  # healthcheck: this sidecar polls /health and the services that need the API wait for it to
  # complete instead.
  template-ready: # change api name
    image: curlimages/curl:latest
    depends_on:
      template: # change api name
        condition: service_started
    command: > # change api name and port
      sh -c 'until curl -fsS http://template:3000/health >/dev/null; do
      echo "waiting for template..."; sleep 2; done; echo "template ready"'
    networks:
      - backend

  k6-perf-test:
    image: grafana/k6:latest
    networks:
      - backend
    volumes:
      - ./load-test.js:/load-test.js
    command: ["run", "/load-test.js"]
    environment:
      - BASE_URL=http://template:3000 # change api name and port
    depends_on:
      template-ready: # change api name
        condition: service_completed_successfully
