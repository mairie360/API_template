name: API CI/CD

# Le template ne se déclenche qu'à la main : ajouter `push:` une fois l'API renommée
# et les variables Postman créées.
on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  APIs-cicd:
    uses: mairie360/CICD/.github/workflows/APIs_cicd.yml@v3.0.0
    permissions:
      contents: write
      packages: write
      id-token: write
    with:
      package_name: template-api # change api name
      cicd_version: v3.0.0
    secrets: inherit
