name: API CI/CD

# Le template ne se déclenche qu'à la main : ajouter `push:` une fois l'API renommée
# et les variables Postman créées.
on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  APIs-cicd:
    uses: mairie360/CICD/.github/workflows/APIs_cicd.yml@v2.2.0
    permissions:
      contents: write
      packages: write
      id-token: write
    with:
      postman_collection: ${{ vars.POSTMAN_TEMPLATE_API_COLLECTION_ID }} # change api name
      postman_environment: ${{ vars.POSTMAN_TEMPLATE_API_ENV_ID }} # change api name
      package_name: template-api # change api name
      cicd_version: v2.2.0
    secrets: inherit
