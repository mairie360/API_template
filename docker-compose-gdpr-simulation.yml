# GDPR usage simulation stack (MAIR-497): the marker stack of MAIR-290 with the
# `gdpr-simulation` runner of mairie360/CICD (tests/gdpr/simulation), which plays
# gdpr-simulation.yaml with fictitious personas. gdpr_simulation_test.sh then runs the purge and the
# database checks, and saves the logs of every container and the Redis keys. Test stack only: the
# runner refuses to start without GDPR_SIMULATION=test-stack. No published port.

volumes:
  postgres-data:
  redis-data:

networks:
  backend:

x-common-env: &common-env
  HOST: "0.0.0.0"
  PORT: 3000 # change port
  REDIS_URL: redis://redis:6379
  DB_TYPE: postgres
  DB_NAME: mairie_360_database
  # The API connects with its own role, like in staging/prod (MAIR-556): a query its grants do not
  # cover fails here. The superuser stays for postgres, liquibase and the seeder.
  DB_USER: core_api # change api role (<api>_api, see Database's api_roles.sql)
  DB_HOST: postgres
  DB_PASSWORD: core-api-password # change api role
  DB_PORT: 5432
  # Serves Swagger UI and /api-docs/openapi.json: dev and test stacks only, never production.
  API_DOCS_ENABLED: "true"

# Own project name: the default one (the folder) is shared with the repo's other compose files,
# whose postgres-data / redis-data volumes `down -v` would otherwise delete.
name: template-api-gdpr-sim
services:
  postgres:
    image: ghcr.io/mairie360/database:dev-949384c
    restart: always
    container_name: mairie360-db-template-api-sim # change api name
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-password}
      POSTGRES_DB: mairie_360_database
    expose:
      - "5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  liquibase:
    image: ghcr.io/mairie360/liquibase-migrations:dev-949384c
    container_name: mairie360-liquibase-template-api-sim # change api name
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      <<: *common-env
      LIQUIBASE_COMMAND_URL: jdbc:postgresql://postgres:5432/mairie_360_database
      LIQUIBASE_COMMAND_USERNAME: ${DB_USER:-postgres}
      LIQUIBASE_COMMAND_PASSWORD: ${DB_PASSWORD:-password}
      LIQUIBASE_SEARCH_PATH: /migrations
    # Database >= MAIR-413 refuses to seed the admin (users.id = 1) without credentials: this
    # throwaway stack uses the public template admin. Never pass the flag on a real instance.
    command: >
      --changelog-file=changelog.xml
      update
      -Dallow_template_admin=true
      -Dcore_api_password=core-api-password
    networks:
      - backend

  seeder:
    image: postgres:18-alpine@sha256:1018733457011bf88d81db98cf43aac6d5150afc18787dbe204771fedf80ff95
    depends_on:
      liquibase:
        condition: service_completed_successfully
    volumes:
      - ./init-test.sql:/init-test.sql:ro
    # ON_ERROR_STOP: a failing fixture must fail the stack.
    command: >
      psql -h postgres -U postgres -d mairie_360_database -v ON_ERROR_STOP=1 -f /init-test.sql
    environment:
      PGPASSWORD: ${DB_PASSWORD:-password}
    networks:
      - backend

  redis:
    image: redis:8.4.0-bookworm@sha256:c22af04bb576503bf16b3e34a1fd2fd82de0f765afd866d2e380145e0af30d78
    container_name: mairie360-redis-template-api-sim # change api name
    restart: always
    expose:
      - "6379"
    volumes:
      - redis-data:/data
    networks:
      - backend
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  template: # change api name
    container_name: template_api-developpement-sim # change api name
    # The API under test: the published ghcr.io/mairie360/template-api:dev-<sha> image in CI, or # change api name
    # template-api:local built by the *_test.sh script from development.Dockerfile. No build: block,
    # so CI tests the artifact that gets promoted instead of recompiling the sources.
    image: ${IMAGE_REF:?IMAGE_REF must name the API image under test, run the matching *_test.sh script}
    networks:
      - backend
    dns:
      - 8.8.8.8
      - 1.1.1.1
    environment:
      <<: *common-env
      PUBLIC_URL: http://template.development.mairie360.fr # change api name
      JWT_TIMEOUT: 3600
      # MAIR-680: Core's public key only, no JWT_SECRET, so every HS256 token is refused. Fresh key
      # pair per run from the matching *_test.sh script (test_secrets.sh), which also signs the
      # runners' tokens with it: no key or token is committed.
      JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY:?JWT_PUBLIC_KEY must be set, run the matching *_test.sh script}
    depends_on:
      liquibase:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  # The published image is distroless (no shell, no curl), so the API cannot carry its own
  # healthcheck: this sidecar polls /ready (Postgres and Redis reachable) and the services that
  # need the API wait for it to complete instead.
  template-ready: # change api name
    image: curlimages/curl:latest@sha256:3fb7e13e5d179a845c97d78204f3f1064d1907037f26a3ebf91710571151fd93
    depends_on:
      template: # change api name
        condition: service_started
    command: > # change api name and port
      sh -c 'until curl -fsS http://template:3000/ready >/dev/null; do
      echo "waiting for template..."; sleep 2; done; echo "template ready"'
    networks:
      - backend

  gdpr-simulation:
    image: node:26-bookworm-slim@sha256:5df79989ed685e09f0a98019db4cebfb22fb9df1a53c0161664a011f7ff6b0f1
    user: "${GDPR_UID:-0}:${GDPR_GID:-0}"
    depends_on:
      template-ready: # change api name
        condition: service_completed_successfully
      seeder:
        condition: service_completed_successfully
    environment:
      ADMIN_JWT: ${ADMIN_JWT:?ADMIN_JWT must be set, run gdpr_simulation_test.sh}
      # The engine refuses to run without it (test stacks only).
      GDPR_SIMULATION: ${GDPR_SIMULATION:?GDPR_SIMULATION=test-stack must be set, run gdpr_simulation_test.sh}
      HOME: /tmp
    volumes:
      - ./cicd-repo/tests/gdpr:/engine:ro
      - ./gdpr-marker.yaml:/journey/gdpr-marker.yaml:ro
      - ./gdpr-simulation.yaml:/journey/gdpr-simulation.yaml:ro
      - ./gdpr-simulation:/run
    # The engine is copied out of the read-only mount before `npm ci` (no root-owned node_modules
    # in the host's cicd-repo/), like the marker runner (tests/gdpr/marker/run.sh).
    command:
      - sh
      - -c
      - >-
        mkdir -p /tmp/engine && tar -C /engine --exclude=./node_modules -cf - . | tar -C /tmp/engine -xf - &&
        cd /tmp/engine && npm ci --omit=dev --no-audit --no-fund --no-update-notifier --loglevel=error &&
        node simulation/simulate.mjs /journey/gdpr-simulation.yaml /run
    networks:
      - backend
