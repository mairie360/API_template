# GDPR log marker journey (MAIR-290), played by mairie360/CICD tests/gdpr/marker.
#
# A marker user with unique values goes through the flows of the API that handle personal data:
# free text the agents write (titles, descriptions, comments), search query strings, and
# deliberate errors (refused values, bodies of the wrong type, unknown rows). The logs of every
# container of docker-compose-gdpr-marker.yml are then searched for its values
# (gdpr_marker_test.sh). A log describes an error by its type and context, never by the value it
# received. The template ships no business endpoint: a new API replaces these steps with its own
# (see Project_API or Message_API), deliberate errors included.
version: 1
target: http://template:3000 # change api name # change port
wait: /ready
# The admin JWT of this run (sub=1, the Admin seeded by liquibase), signed by gdpr_marker_test.sh.
env: [ADMIN_JWT]
steps:
  - name: call an unknown route with the marker in the query string (deliberate error)
    request: {method: GET, path: "/api/v1/unknown?search={{marker.email}}&name={{marker.last_name}}", headers: {Authorization: "Bearer {{env.ADMIN_JWT}}"}}
    expect: [404]
  - name: send the marker to an unknown route (deliberate error)
    request:
      method: POST
      path: /api/v1/unknown
      headers: {Authorization: "Bearer {{env.ADMIN_JWT}}"}
      json: {first_name: "{{marker.first_name}}", phone: "{{marker.phone}}"}
    expect: [404]
