# Integration test stack (MAIR-117): the same services as docker-compose.yml plus a `newman`
# runner that replays the committed Postman collection against the API over the compose network.
# Run it with ./integration_test.sh (this is what the CICD `integration_tests` job executes).
volumes:
  postgres-data:
  redis-data:
  template-target: # change api name

networks:
  backend:

x-common-env: &common-env
  HOST: "0.0.0.0"
  PORT: 3000 # change port
  REDIS_URL: redis://redis:6379
  DB_TYPE: postgres
  DB_NAME: mairie_360_database
  DB_USER: postgres
  DB_HOST: postgres
  DB_PASSWORD: password
  DB_PORT: 5432

services:
  postgres:
    image: ghcr.io/mairie360/database:1.1.0
    restart: always
    container_name: mairie360-db-template-api-integration # change api name
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-password}
      POSTGRES_DB: mairie_360_database
    expose:
      - "5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  liquibase:
    image: ghcr.io/mairie360/liquibase-migrations:1.1.0
    container_name: mairie360-liquibase-template-api-integration # change api name
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      <<: *common-env
      LIQUIBASE_COMMAND_URL: jdbc:postgresql://postgres:5432/mairie_360_database
      LIQUIBASE_COMMAND_USERNAME: ${DB_USER:-postgres}
      LIQUIBASE_COMMAND_PASSWORD: ${DB_PASSWORD:-password}
      LIQUIBASE_SEARCH_PATH: /migrations
    command: >
      --changelog-file=changelog.xml
      update
    networks:
      - backend

  redis:
    image: redis:8.4.0-bookworm
    container_name: mairie360-redis-template-api-integration # change api name
    restart: always
    expose:
      - "6379"
    volumes:
      - redis-data:/data
    networks:
      - backend
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Seeds the extra test user (id 2) for collections that need a second account.
  seeder:
    image: postgres:18-alpine
    container_name: mairie360-seeder-template-api-integration # change api name
    depends_on:
      liquibase:
        condition: service_completed_successfully
    volumes:
      - ./init-test.sql:/init-test.sql
    command: >
      sh -c "psql -h postgres -U postgres -d mairie_360_database -f /init-test.sql"
    environment:
      PGPASSWORD: ${DB_PASSWORD:-password}
    networks:
      - backend

  template: # change api name
    container_name: template-api-integration # change api name
    build:
      context: .
      dockerfile: development.Dockerfile
    restart: always
    expose:
      - "3000" # change port
    volumes:
      - template-target:/usr/src/template/target # change api name
    networks:
      - backend
    dns:
      - 8.8.8.8
      - 1.1.1.1
    environment:
      <<: *common-env
      PUBLIC_URL: http://template.development.mairie360.fr # change api name
      JWT_SECRET: b"secret"
      JWT_TIMEOUT: 3600
    depends_on:
      seeder:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://template:3000/health"] # change api name and port
      interval: 10s
      timeout: 5s
      retries: 5
      # `cargo run` compiles the crate at container start: leave room for a cold CI runner.
      start_period: 300s

  # Replays tests/postman/collection.json against the `template` service. `baseUrl` is injected
  # here so the committed environment stays usable from a host shell (http://localhost:3000).
  # `--bail` stops at the first failing request; the exit code is what integration_test.sh returns.
  newman:
    image: postman/newman:6.1.3-alpine
    container_name: mairie360-newman-template-api # change api name
    networks:
      - backend
    volumes:
      - ./tests/postman:/etc/newman:ro
    depends_on:
      template: # change api name
        condition: service_healthy
    command: >
      run /etc/newman/collection.json
      --environment /etc/newman/environment.json
      --env-var baseUrl=http://template:3000 # change api name and port
      --bail
